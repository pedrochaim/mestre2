<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@600&display=swap" rel="stylesheet">
  <title>Mestre2 · Arena</title>
  <style>
    /* Celular do jogador na Arena: entra com nome e cor e responde. Não carrega o banco de perguntas: o texto da rodada
       vem do Firestore. */
    :root { color-scheme: dark;
            --fundo: #000; --texto: #F4F4F2; --suave: #A0A4AB; --linha: #2A2D33; --cartao: #101114;
            --acento: #FFD100; --certo: #3DDC84; --errado: #FF6B57; --sobre-cor: #000;
            /* Identidade Metrô (2026-11-24): Overpass nos textos, Overpass Mono em códigos e números;
               amarelo de sinalização (--acento) só no botão principal, na seleção e no anel dos peões. */
            --fonte: "Overpass", system-ui, sans-serif; --mono: "Overpass Mono", ui-monospace, monospace; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--fundo); color: var(--texto); font: 17px/1.45 var(--fonte); }
    main { max-width: 560px; margin: 0 auto; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    h1 { font-size: 1.4rem; margin: .5rem 0 .3rem; }
    a { color: var(--acento); }
    button, input { font: inherit; color: inherit; }
    button { background: var(--cartao); border: 1px solid var(--linha); border-radius: 10px; padding: .6rem 1rem; cursor: pointer; }
    button.principal { background: var(--acento); border-color: var(--acento); color: var(--sobre-cor); font-weight: 800; }
    button:disabled { cursor: default; }
    input { background: var(--cartao); border: 1px solid var(--linha); border-radius: 10px; padding: .7rem .8rem; width: 100%; }
    label { display: block; margin: .8rem 0 .3rem; color: var(--suave); font-size: .9rem; }
    .suave { color: var(--suave); font-size: .9rem; }
    .erro { color: var(--errado); }
    .cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: 14px; padding: 1rem; margin: 1rem 0; }
    .topo { display: flex; justify-content: space-between; align-items: center; gap: .6rem; }
    .codigo { font-family: var(--mono); font-weight: 600; letter-spacing: .15em; color: var(--acento); }
    .ficha { display: inline-flex; align-items: center; gap: .35em; padding: .15em .6em .15em .15em; border: 1px solid var(--linha);
             border-radius: 999px; background: var(--cartao); }
    /* Avatar (arena-avatares.js) no lugar da bolinha de iniciais: o desenho já traz o anel e as iniciais. */
    .bola.av { border: none; background: none; width: 2.4em; height: 2.4em; font-size: inherit; }
    .bola.av svg { width: 100%; height: 100%; display: block; }
    .bola { width: 1.8em; height: 1.8em; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 800; font-size: .8em;
            border: 2px solid var(--acento); flex: none; }

    /* Cores do peão */
    /* Escolha do avatar: abas Personagens e Times e a grade com os desenhos. */
    .abas-av { display: flex; gap: .4rem; margin-bottom: .5rem; }
    .abas-av button { flex: 1; padding: .4rem .5rem; font-size: .9rem; }
    .abas-av button[aria-selected="true"] { background: var(--texto); border-color: var(--texto); color: #000; font-weight: 800; }
    #avatares { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; max-height: 18rem; overflow: auto; padding: 2px; }
    #avatares button { padding: 4px; border-radius: 14px; border: 2px solid transparent; }
    #avatares button[aria-pressed="true"] { border-color: var(--acento); box-shadow: 0 0 0 2px #FFD10055; }
    #avatares svg { width: 100%; height: auto; display: block; }
    #cores { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
    #cores button { height: 3rem; border-radius: 12px; border: 3px solid transparent; }
    #cores button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--acento); }

    /* Jogo */
    #casa { font-weight: 700; }
    .etiqueta { display: inline-block; background: var(--c, #333); color: var(--ct, #fff); border-radius: 8px; padding: .2em .75em;
                font-weight: 800; font-size: .85rem; }
    #enunciado { font-size: 1.15rem; font-weight: 600; margin: .6rem 0; }
    #aviso-figura { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin: 0 0 .6rem; }
    #ver-figura { margin-left: auto; padding: .45rem .9rem; font-weight: 700; color: var(--texto); }
    /* A contagem do modo automático para a próxima pergunta: a mesma da tela grande (arena-contagem.js). */
    /* A figura no próprio celular, em tela cheia; tocar volta. */
    #figura-cheia { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; align-items: center;
                    justify-content: center; padding: 8px; cursor: zoom-out; }
    #figura-cheia img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #figura-cheia span { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; color: var(--suave);
                         background: #000c; padding: .2em .6em; border-radius: .5em; font-size: .85rem; }
    #tempo { display: flex; align-items: center; gap: .6rem; font-weight: 800; margin: .4rem 0 .8rem; }
    #tempo-barra { flex: 1; height: 8px; background: var(--linha); border-radius: 999px; overflow: hidden; }
    #tempo-barra div { height: 100%; background: var(--acento); }
    #tempo.acabando #tempo-barra div { background: var(--errado); }
    #tempo-s { min-width: 2.4em; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--acento); }
    #botoes { display: grid; gap: .6rem; }
    #botoes button { display: flex; align-items: center; gap: .8rem; text-align: left; padding: .9rem 1rem; min-height: 4rem;
                     font-size: 1.05rem; font-weight: 600; border-width: 2px; }
    #botoes .letra { flex: none; width: 2rem; height: 2rem; border-radius: 6px; background: var(--texto); color: #000; display: grid; place-items: center; font-family: var(--mono); font-weight: 600; }
    #botoes button.escolhida { border-color: var(--acento); color: var(--acento); background: var(--fundo); }
    #botoes button.escolhida .letra { background: var(--acento); color: #000; }
    #botoes button.certa { border-color: var(--certo); background: var(--certo); color: #000; }
    #botoes button.certa .letra { background: #000; color: var(--certo); }
    #botoes.travado button:not(.escolhida):not(.certa) { opacity: .4; }
    #situacao { text-align: center; margin: .8rem 0 0; font-weight: 700; }
    /* Casa do tema: a pergunta é do tema da casa do jogador, e acertando ele anda duas. */
    #dobro { margin: .5rem 0 0; font-weight: 700; border-left: 4px solid var(--c); padding-left: .6rem; }
    #resultado { text-align: center; padding: 1.4rem 1rem; border-radius: 16px; margin: 1rem 0; border: 2px solid var(--linha); }
    #resultado.acertou { border-color: var(--certo); background: #0f2a1a; }
    #resultado.errou { border-color: var(--errado); background: #2f1510; }
    #resultado strong { display: block; font-size: 1.8rem; }
    .grande { font-size: 1.3rem; text-align: center; margin: 2rem 0 1rem; }
    /* Capataz: o jogador escolhido pela tela grande para comandar a próxima pergunta e o modo automático. */
    #capataz { border: 2px solid #ffd23f; border-radius: 16px; padding: .9rem 1rem; margin: 1rem 0; background: #1b1607; }
    #capataz h2 { margin: 0 0 .6rem; font-size: 1rem; color: #ffd23f; }
    #capataz .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    #capataz button { min-height: 3.2rem; font-weight: 700; }
    #capataz button:disabled { opacity: .4; }
    #capataz-msg { margin: .5rem 0 0; color: var(--suave); font-size: .85rem; min-height: 1.2em; }
    /* Suspense (experimental): enquanto a tela grande elimina as alternativas, o celular pulsa no mesmo ritmo. */
    #resultado.suspense { animation: celbate var(--bpm, 900ms) ease-in-out infinite; }
    @keyframes celbate { 0%, 100% { border-color: var(--linha); } 18% { border-color: #f0f0ea; } 34% { border-color: var(--linha); }
                         48% { border-color: #c9c9c2; } }
    .pontos span { display: inline-block; animation: ponto 1s infinite; }
    .pontos span:nth-child(2) { animation-delay: .15s; } .pontos span:nth-child(3) { animation-delay: .3s; }
    @keyframes ponto { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #resultado.suspense, .pontos span { animation: none; } }
  </style>
</head>
<body>
<main>

  <!-- Entrar: código, nome e cor do peão -->
  <section id="entrada" hidden>
    <p><a href="./">← Mestre2</a></p>
    <h1>Arena</h1>
    <p class="suave">A pergunta aparece na tela grande; você responde por aqui.</p>
    <form id="form-entrar">
      <label for="campo-codigo">Código da partida</label>
      <input id="campo-codigo" maxlength="4" autocomplete="off" style="text-transform:uppercase" required>
      <label for="campo-nome">Seu nome</label>
      <input id="campo-nome" maxlength="30" autocomplete="nickname" required>
      <label>Seu avatar</label>
      <div class="abas-av" role="tablist" aria-label="Tipo de avatar">
        <button type="button" role="tab" id="aba-personagens" aria-selected="true">Personagens</button>
        <button type="button" role="tab" id="aba-times" aria-selected="false">Times</button>
        <button type="button" role="tab" id="aba-personalizados" aria-selected="false" hidden>Personalizados</button>
      </div>
      <div id="avatares" role="group" aria-label="Avatar"></div>
      <label>Sua cor</label>
      <div id="cores" role="group" aria-label="Cor do peão"></div>
      <button class="principal" style="width:100%;margin-top:1.2rem">Entrar</button>
    </form>
    <p id="erro-entrada" class="erro"></p>
  </section>

  <p id="conectando" class="grande suave">Conectando…</p>

  <!-- Na partida -->
  <section id="jogo" hidden>
    <div class="topo">
      <span id="eu"></span>
      <span><span id="casa"></span></span>
      <button id="sair">Sair</button>
    </div>
    <p class="suave" style="margin:.3rem 0 0">Partida <span id="codigo" class="codigo"></span></p>

    <p id="espera" class="grande"></p>

    <div id="pergunta" hidden>
      <div class="cartao">
        <span id="tema" class="etiqueta"></span>
        <p id="dobro" hidden></p>
        <p id="enunciado"></p>
        <div id="aviso-figura" class="suave" hidden><span>🖼️ Olhe a figura na tela grande.</span>
          <button id="ver-figura" type="button" hidden>Ver aqui</button></div>
        <div id="tempo"><div id="tempo-barra"><div></div></div><span id="tempo-s"></span></div>
        <div id="botoes"></div>
        <p id="situacao"></p>
      </div>
    </div>

    <div id="resultado" hidden></div>
    <div id="proxima-aviso" hidden aria-live="polite"></div>
    <div id="acertos" hidden aria-live="polite"></div>

    <!-- A figura da pergunta neste celular, em tela cheia -->
    <div id="figura-cheia" hidden><img alt="Figura da pergunta"><span>Toque para voltar</span></div>

    <!-- Só no celular do capataz -->
    <div id="capataz" hidden>
      <h2>👷 Você é o capataz</h2>
      <div class="botoes">
        <button id="cap-proxima" class="principal">Próxima pergunta</button>
        <button id="cap-auto">▶ Iniciar modo automático</button>
      </div>
      <p id="capataz-msg"></p>
    </div>
    <p id="erro-jogo" class="erro"></p>
  </section>
</main>

<script type="module">
  import { doc, getDoc, getDocFromServer, setDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
  import { CHEGADA, temaDaCasa, ehEspecial, ordemDaArena, QUALQUER } from "./linear.js";
  import { TEMPOS } from "./arena-suspense.js";
  import { SEGUNDOS, criarContagem } from "./arena-contagem.js";
  import { criarResultado, escolherResultado } from "./arena-resultado.js";
  import { PERSONAGENS, TIMES_DE_FUTEBOL, PERSONALIZADOS, personalizadosProntos, desenhoAvatar, avatarValido } from "./arena-avatares.js";
  import { db, entrarAnonimo, OPCOES, CORES, corDe, $, el, esc, umDe, ficha, restante, agora, acertarRelogio, manterAcesa }
    from "./arena-comum.js";

  let uid = null;
  let codigo = null;
  let partida = {};
  let eu = null;              // o meu documento de jogador
  let minha = null;           // a minha resposta na rodada em jogo: {n, opcao} (ou só a escolha, enquanto grava)
  let desligar = [];
  let desligarMinha = null, nMinha = null;
  let nVisto;                 // última rodada vista, para acertar o relógio e vibrar só nas que começam ao vivo
  const nomes = new Map();    // id → nome, para mostrar quem venceu
  // Suspense (experimental, arena-suspense.js): a revelação vista ao vivo espera a animação da tela grande, no mesmo
  // ritmo; a casa do jogador também só muda depois.
  let abertaVista = null;     // última rodada vista ainda aberta (respondendo ou encerrada)
  let suspense = null;        // {n, inicio}: a rodada cuja revelação está em suspense
  const emSuspense = () => suspense !== null && partida.rodada?.n === suspense.n;
  // Figura no próprio celular (2026-11-24): a tela grande grava em rodada.figura o arquivo da figura; "Ver aqui" a abre
  // em tela cheia (só então a imagem é baixada) e um toque ou Esc fecha. Rodadas antigas (figura = true) só têm o aviso.
  let figuraCheia = null;     // arquivo da figura aberta em tela cheia
  function abrirFigura(arquivo) {
    figuraCheia = arquivo;
    $("figura-cheia").querySelector("img").src = "img/" + arquivo;
    $("figura-cheia").hidden = false;
  }
  function fecharFigura() { figuraCheia = null; $("figura-cheia").hidden = true; }
  $("figura-cheia").onclick = fecharFigura;
  addEventListener("keydown", e => { if (e.key === "Escape" && figuraCheia) fecharFigura(); });
  let casaAntes = null;       // a casa mostrada antes do suspense

  // ---------------------------------------------------------------- entrada

  let cor = null;
  try { cor = localStorage.getItem("mestre2.arena.cor"); } catch {}
  if (!CORES[cor]) cor = umDe(Object.keys(CORES));
  try { $("campo-nome").value = localStorage.getItem("mestre2.arena.nome") || ""; } catch {}
  function desenharCores() {
    $("cores").replaceChildren(...Object.keys(CORES).map(t => {
      const b = el("button", { type: "button", title: t });
      b.style.background = CORES[t][0];
      b.setAttribute("aria-label", t);
      b.setAttribute("aria-pressed", String(t === cor));
      b.onclick = () => { cor = t; desenharCores(); };
      return b;
    }));
  }
  desenharCores();

  // Avatar (arena-avatares.js): um personagem ou a bandeira de um time; o último escolhido fica guardado no aparelho.
  let avatar = null;
  try { avatar = localStorage.getItem("mestre2.arena.avatar"); } catch {}
  // Um avatar personalizado só é conferido quando a lista deles chega (personalizadosProntos).
  if (!avatarValido(avatar) && !avatar?.startsWith("c-")) avatar = umDe(PERSONAGENS).id;
  let abaAvatar = avatar.startsWith("t-") ? "times" : avatar.startsWith("c-") ? "personalizados" : "personagens";
  function desenharAvatares() {
    $("aba-personalizados").hidden = !PERSONALIZADOS.length;
    if (abaAvatar === "personalizados" && !PERSONALIZADOS.length) abaAvatar = "personagens";
    for (const a of ["personagens", "times", "personalizados"]) $("aba-" + a).setAttribute("aria-selected", String(a === abaAvatar));
    const lista = abaAvatar === "times" ? TIMES_DE_FUTEBOL : abaAvatar === "personalizados" ? PERSONALIZADOS : PERSONAGENS;
    $("avatares").replaceChildren(...lista.map(a => {
      const b = el("button", { type: "button", title: a.nome });
      b.innerHTML = desenhoAvatar(a.id);
      b.setAttribute("aria-label", a.nome);
      b.setAttribute("aria-pressed", String(a.id === avatar));
      b.onclick = () => { avatar = a.id; desenharAvatares(); };
      return b;
    }));
  }
  $("aba-personagens").onclick = () => { abaAvatar = "personagens"; desenharAvatares(); };
  $("aba-times").onclick = () => { abaAvatar = "times"; desenharAvatares(); };
  $("aba-personalizados").onclick = () => { abaAvatar = "personalizados"; desenharAvatares(); };
  desenharAvatares();
  personalizadosProntos.then(() => {
    if (!avatarValido(avatar)) { avatar = umDe(PERSONAGENS).id; abaAvatar = "personagens"; }
    desenharAvatares();
    desenhar();  // quem está na partida com um personalizado
  });

  function mostrarEntrada(c = "") {
    $("conectando").hidden = true;
    $("jogo").hidden = true;
    $("entrada").hidden = false;
    if (c) $("campo-codigo").value = c;
    ($("campo-codigo").value ? $("campo-nome") : $("campo-codigo")).focus();
  }

  // Confere se o código é de uma partida da Arena; devolve a mensagem de erro, ou null.
  async function conferir(c) {
    const snap = await getDoc(doc(db, "partidas", c));
    if (!snap.exists()) return "Partida não encontrada.";
    if (snap.data().modo !== "arena") return `Esta partida não é da Arena. <a href="./#${esc(c)}">Abrir no Mestre2</a>`;
    return null;
  }

  $("form-entrar").onsubmit = async e => {
    e.preventDefault();
    $("erro-entrada").textContent = "";
    const c = $("campo-codigo").value.trim().toUpperCase(), nome = $("campo-nome").value.trim();
    if (!/^[A-Z]{4}$/.test(c)) return ($("erro-entrada").textContent = "O código tem 4 letras.");
    if (!nome) return;
    try {
      const erro = await conferir(c);
      if (erro) return ($("erro-entrada").innerHTML = erro);
      try { localStorage.setItem("mestre2.arena.nome", nome); localStorage.setItem("mestre2.arena.cor", cor);
            localStorage.setItem("mestre2.arena.avatar", avatar); } catch {}
      // O documento do jogador tem o id deste aparelho. Quem volta só troca nome e cor; a casa continua a mesma.
      const ref = doc(db, "partidas", c, "jogadores", uid);
      if ((await getDoc(ref)).exists()) await updateDoc(ref, { nome, tema: cor, avatar });
      else await setDoc(ref, { nome, tema: cor, avatar, pontos: 0, criado_em: serverTimestamp() });
      jogar(c);
    } catch (e) {
      $("erro-entrada").textContent = "Erro: " + e.message;
    }
  };

  // ---------------------------------------------------------------- na partida

  function jogar(c) {
    codigo = c;
    history.replaceState(null, "", "#" + c);
    $("codigo").textContent = c;
    $("conectando").hidden = true;
    $("entrada").hidden = true;
    $("jogo").hidden = false;
    $("erro-jogo").textContent = "";
    manterAcesa();
    const base = doc(db, "partidas", c);
    nVisto = undefined;
    desligar.push(onSnapshot(base, snap => receberPartida(snap.data({ serverTimestamps: "estimate" }) || {})));
    desligar.push(onSnapshot(doc(base, "jogadores", uid), snap => {
      eu = snap.exists() ? { id: snap.id, ...snap.data() } : null;
      // Tirado da partida pela tela grande (ou saiu por outro aparelho com o mesmo login).
      if (!eu) return sair("Você não está mais nesta partida. Entre de novo, se quiser.");
      desenhar();
    }));
  }

  // Um retrato novo da partida, do ouvinte do Firestore ou lido direto do servidor (quando o ouvinte atrasa).
  function receberPartida(dados) {
    partida = dados;
    const r = partida.rodada;
    if (r && nVisto !== undefined && r.n !== nVisto && r.fase === "respondendo") {
      if (r.inicio) acertarRelogio(r.inicio.toMillis());
      navigator.vibrate?.(120);
    }
    nVisto = r?.n ?? null;
    ouvirMinha(r?.n ?? null);
    if (r && r.fase !== "revelada") abertaVista = r.n;
    if (r?.fase === "revelada" && partida.experimental && abertaVista === r.n && suspense?.n !== r.n) {
      const n = r.n;
      suspense = { n, inicio: Date.now() };
      abertaVista = null;  // o suspense desta rodada já começou: retratos seguintes da partida não o repetem
      setTimeout(() => {
        if (suspense?.n !== n) return;
        suspense = null;
        desenhar();
        const acertei = minha?.opcao === partida.rodada?.certa;
        navigator.vibrate?.(acertei ? [60, 60, 60] : 250);
        if (partida.rodada?.n === n && partida.rodada.fase === "revelada") iniciarResultado(partida.rodada);
      }, TEMPOS.revelaEm);
    }
    desenhar();
    if (r?.fase === "revelada" && !partida.experimental && abertaVista === r.n) iniciarResultado(r);
  }

  // Quem acertou e quem errou (2026-11-26, arena-resultado.js): a animação da tela grande, só com este jogador ("Você
  // acertou!", "Você errou", "Sem resposta"), logo depois da revelação vista ao vivo (no fim do suspense, se ele estiver
  // ligado). A animação é sorteada pela rodada, a mesma da tela grande; aqui, sem som.
  const telaResultado = criarResultado($("acertos"));
  let resultadoDe = null;
  function iniciarResultado(r) {
    if (!codigo || !eu || resultadoDe === r.n) return;
    resultadoDe = r.n;
    const acertou = minha?.opcao === r.certa;
    const casas = (acertou && !r.todos ? ((r.dobro || []).includes(uid) ? 2 : 1) : 0) - ((r.recuo || []).includes(uid) ? 1 : 0);
    telaResultado.mostrar(r.n, escolherResultado((partida.semente || 0) * 31 + r.n),
      [{ nome: eu.nome, avatar: eu.avatar, cor: corDe(eu.tema), acertou, casas, semResposta: !minha }], true, Boolean(r.todos));
  }

  // A minha resposta na rodada em jogo, como ficou gravada.
  function ouvirMinha(n) {
    if (n === nMinha) return;
    desligarMinha?.();
    desligarMinha = null;
    nMinha = n;
    minha = null;
    if (n === null) return;
    desligarMinha = onSnapshot(doc(db, "partidas", codigo, "respostas", `${n}_${uid}`), snap => {
      if (snap.exists()) minha = snap.data();
      desenhar();
    });
  }

  async function responder(i) {
    const r = partida.rodada;
    // Vale responder até a resposta aparecer, mesmo depois de acabado o tempo (2026-11-23).
    if (!r || r.fase !== "respondendo" || minha) return;
    minha = { n: r.n, opcao: i, gravando: true };
    desenhar();
    try {
      // Uma resposta por rodada, sem troca: a regra só aceita criar, dentro do prazo.
      await setDoc(doc(db, "partidas", codigo, "respostas", `${r.n}_${uid}`),
                   { n: r.n, jogador: uid, opcao: i, em: serverTimestamp() });
    } catch (e) {
      if (minha?.n === r.n && minha.gravando) minha = null;
      $("erro-jogo").textContent = e.code === "permission-denied" ? "A resposta não chegou a tempo." : "Erro: " + e.message;
      desenhar();
    }
  }

  function sair(aviso = "") {
    desligar.forEach(f => f());
    desligar = [];
    desligarMinha?.();
    desligarMinha = null; nMinha = null;
    codigo = null; partida = {}; eu = null; minha = null; suspense = null; abertaVista = null;
    telaResultado.esconder();
    mostrarEntrada();
    $("erro-entrada").textContent = aviso;
  }
  $("sair").onclick = async () => {
    if (!confirm("Sair da partida? Seu peão sai do tabuleiro.")) return;
    const c = codigo;
    sair();  // antes de apagar, para o aviso de "tirado da partida" não aparecer
    try { await deleteDoc(doc(db, "partidas", c, "jogadores", uid)); } catch {}
  };

  // ---------------------------------------------------------------- capataz

  // O capataz (escolhido pela tela grande, campo "capataz" da partida) manda comandos pelo campo "comando"; a tela grande
  // executa: "proxima" (a próxima pergunta) e "automatico" (iniciar ou pausar o modo automático, cujo estado está em
  // "automatico"). Só o celular do capataz mostra os botões.
  let enviando = false;
  function desenharCapataz() {
    const sou = partida.capataz === uid && !partida.fim;
    $("capataz").hidden = !sou;
    if (!sou) return;
    const r = partida.rodada;
    const podeProxima = !r || (r.fase === "revelada" && !emSuspense());
    $("cap-proxima").textContent = r ? "Próxima pergunta" : "Começar";
    $("cap-proxima").disabled = enviando || !podeProxima;
    $("cap-auto").textContent = partida.automatico ? "⏸ Pausar modo automático" : "▶ Iniciar modo automático";
    $("cap-auto").disabled = enviando;
    if (!enviando) $("capataz-msg").textContent = !podeProxima && r?.fase !== "revelada" ? "A próxima pergunta fica liberada quando a resposta aparecer." : "";
  }
  async function comandar(acao) {
    if (enviando || partida.capataz !== uid) return;
    enviando = true;
    $("capataz-msg").textContent = "Enviando…";
    desenharCapataz();
    try {
      await updateDoc(doc(db, "partidas", codigo), { comando: { acao, n: (partida.comando?.n || 0) + 1, em: serverTimestamp() } });
      $("capataz-msg").textContent = acao === "proxima" ? "Pedido enviado à tela grande." : "Modo automático: pedido enviado.";
    } catch (e) {
      $("capataz-msg").textContent = e.code === "permission-denied" ? "Você não é mais o capataz." : "Erro: " + e.message;
    }
    setTimeout(() => { enviando = false; desenharCapataz(); }, 1500);
  }
  $("cap-proxima").onclick = () => comandar("proxima");
  $("cap-auto").onclick = () => comandar("automatico");

  // ---------------------------------------------------------------- desenho

  function desenhar() {
    if (!codigo || !eu) return;
    const r = partida.rodada;
    const arquivoFigura = typeof r?.figura === "string" && r.figura ? r.figura : null;
    if (figuraCheia && (figuraCheia !== arquivoFigura || partida.fim)) fecharFigura();
    desenharCapataz();
    $("eu").replaceChildren(ficha(eu));
    // Em "encerrada" e durante o suspense, a casa fica a de antes (o peão só anda quando a resposta aparece), chegue antes
    // a atualização do jogador ou a da partida.
    if (!(emSuspense() || r?.fase === "encerrada") || casaAntes === null) casaAntes = Math.min(eu.pontos || 0, CHEGADA);
    $("casa").textContent = `Casa ${casaAntes} de ${CHEGADA}`;
    $("erro-jogo").textContent = r?.fase === "respondendo" ? $("erro-jogo").textContent : "";

    if (partida.fim && !emSuspense()) {
      $("pergunta").hidden = true;
      $("resultado").hidden = true;
      $("espera").hidden = false;
      const venci = (partida.vencedores || []).includes(uid);
      $("espera").textContent = venci ? "🏆 Você venceu!" : "Fim de partida. Veja quem venceu na tela grande.";
      return;
    }
    if (!r) {
      $("pergunta").hidden = true;
      $("resultado").hidden = true;
      $("espera").hidden = false;
      $("espera").textContent = "Você está na partida. Aguarde a primeira pergunta.";
      return;
    }

    $("espera").hidden = true;
    $("pergunta").hidden = false;
    const [c, ct] = corDe(r.tema);
    $("tema").style.setProperty("--c", c);
    $("tema").style.setProperty("--ct", ct);
    $("tema").textContent = r.tema;
    // Casa do tema (2026-11-24): a pergunta é do tema da casa em que o jogador está; quem decide é a tela grande, que
    // também sabe se ele está sozinho na frente (aí anda uma só).
    // Casa ★: acertando, quem está à frente volta uma casa.
    const minhaCasa = Math.min(eu.pontos || 0, CHEGADA);
    const casaDoTema = r.fase === "respondendo" && temaDaCasa(minhaCasa, partida.semente) === r.tema;
    const casaEstrela = r.fase === "respondendo" && ehEspecial(minhaCasa);
    $("dobro").hidden = !casaDoTema && !casaEstrela;
    if (casaDoTema) {
      $("dobro").style.setProperty("--c", c);
      $("dobro").textContent = `Você está numa casa de ${r.tema}: se acertar, anda duas (menos se estiver sozinho na frente).`;
    } else if (casaEstrela) {
      $("dobro").style.setProperty("--c", "var(--texto)");
      $("dobro").textContent = "★ Você está numa casa especial: se acertar, todos à sua frente voltam uma casa.";
    }
    $("enunciado").textContent = r.enunciado;
    $("aviso-figura").hidden = !r.figura;
    $("ver-figura").hidden = !arquivoFigura;
    $("ver-figura").onclick = () => abrirFigura(arquivoFigura);

    const revelada = r.fase === "revelada" && !emSuspense();
    const aberta = r.fase === "respondendo";
    $("tempo").hidden = r.fase !== "respondendo";
    $("botoes").classList.toggle("travado", Boolean(minha) || !aberta);
    $("botoes").replaceChildren(...r.opcoes.map((texto, i) => {
      const b = el("button", { type: "button" });
      b.append(el("span", { className: "letra", textContent: OPCOES[i] }), el("span", { textContent: texto }));
      if (minha?.opcao === i) b.classList.add("escolhida");
      if (revelada && r.certa === i) b.classList.add("certa");
      b.disabled = Boolean(minha) || !aberta;
      b.onclick = () => responder(i);
      return b;
    }));
    $("situacao").textContent =
      r.fase === "respondendo" ? (minha ? (minha.gravando ? "Enviando…" : `Resposta enviada: ${OPCOES[minha.opcao]}`)
        : restante(r) > 0 ? "" : "Tempo esgotado, mas ainda dá para responder.")
      : r.fase === "encerrada" ? "Conferindo…" : "";

    if (emSuspense()) return desenharSuspense();
    $("resultado").hidden = !revelada;
    if (revelada) {
      const acertei = minha?.opcao === r.certa;
      $("resultado").className = minha ? (acertei ? "acertou" : "errou") : "";
      $("resultado").innerHTML = minha
        ? (acertei ? (r.todos ? "<strong>Acertou!</strong> Todos acertaram: ninguém anda."
            : (r.dobro || []).includes(uid) ? "<strong>Acertou!</strong> Seu peão anda duas casas."
            : "<strong>Acertou!</strong> Seu peão anda uma casa.") : `<strong>Errou.</strong> A certa era ${OPCOES[r.certa] ?? "?"}.`)
        : `<strong>Sem resposta.</strong> A certa era ${OPCOES[r.certa] ?? "?"}.`;
      if ((r.recuo || []).includes(uid)) $("resultado").innerHTML += "<br>★ Alguém acertou numa casa especial atrás de você: você volta uma casa.";
    }
    desenharTempo();
  }

  // Enquanto a tela grande elimina as alternativas, o celular pulsa no mesmo ritmo e mostra "Revelando…".
  let suspenseMostrado = null;
  function desenharSuspense() {
    const caixa = $("resultado");
    caixa.hidden = false;
    caixa.className = "suspense";
    caixa.style.setProperty("--bpm", `${TEMPOS.ritmoEm(Date.now() - suspense.inicio)}ms`);
    if (suspenseMostrado === suspense.n) return;
    suspenseMostrado = suspense.n;
    caixa.innerHTML = `E a resposta certa é…<strong class="pontos">Revelando<span>.</span><span>.</span><span>.</span></strong>`;
  }

  function desenharTempo() {
    const r = partida.rodada;
    if (emSuspense()) return desenharSuspense();
    if (!r || r.fase !== "respondendo") return;
    const ms = restante(r);
    $("tempo-barra").firstElementChild.style.width = `${(100 * ms / (r.prazo * 1000)).toFixed(1)}%`;
    $("tempo-s").textContent = `${Math.ceil(ms / 1000)} s`;
    $("tempo").classList.toggle("acabando", ms > 0 && ms <= 5000);
  }
  // "Próxima pergunta em": a contagem do modo automático, gravada pela tela grande em "proxima" ({n, em, tema}), com a
  // animação do tema da próxima pergunta, como na tela grande; some se a rodada mudar, se o modo automático for pausado
  // ou durante o suspense.
  const contagem = criarContagem($("proxima-aviso"));
  function desenharProxima() {
    const r = partida.rodada, x = partida.proxima;
    const valendo = codigo && x && r && x.n === r.n && r.fase === "revelada" && partida.automatico !== false && !partida.fim
      && !emSuspense() && !telaResultado.visivel && x.em - agora() > -500;
    // A animação de quem acertou some se a rodada mudar no meio.
    if (telaResultado.visivel && (!codigo || r?.n !== telaResultado.id || r.fase !== "revelada")) telaResultado.esconder();
    if (!valendo) return contagem.esconder();
    // Na posição ★ Qualquer da sequência dos temas, a roleta da tela grande (a mesma, pela mesma chave).
    const ordem = ordemDaArena(partida.semente), qualquer = ordem[r.n % ordem.length] === QUALQUER;
    contagem.mostrar(x.tema || "", x.em - agora(), SEGUNDOS, (partida.semente || 0) * 31 + r.n, null, qualquer);
  }
  // A contagem anda sozinha; quando o tempo acaba, o aviso muda (os botões continuam valendo). Se a rodada ficar parada
  // em "encerrada" (ou passar do prazo) por alguns segundos, o celular confere a partida direto no servidor, para o
  // caso de o ouvinte do Firestore ter atrasado.
  let noPrazo = false, paradaDesde = null, conferindo = false;
  setInterval(async () => {
    const r = partida.rodada;
    const parada = codigo && r && (r.fase === "encerrada" || (r.fase === "respondendo" && restante(r) <= 0));
    paradaDesde = parada ? paradaDesde ?? Date.now() : null;
    // Em "encerrada", a conferência é rápida; depois do prazo, a rodada pode ficar aberta um bom tempo, então confere com
    // mais calma.
    const espera = r?.fase === "encerrada" ? 3000 : 8000;
    if (parada && Date.now() - paradaDesde > espera && !conferindo) {
      conferindo = true;
      paradaDesde = Date.now();
      const c = codigo;
      try { const snap = await getDocFromServer(doc(db, "partidas", c)); if (codigo === c) receberPartida(snap.data() || {}); } catch {}
      conferindo = false;
    }
    desenharProxima();
    if (codigo && emSuspense()) return desenharSuspense();
    if (!codigo || r?.fase !== "respondendo") return;
    desenharTempo();
    const agoraNoPrazo = restante(r) > 0;
    if (agoraNoPrazo !== noPrazo) { noPrazo = agoraNoPrazo; desenhar(); }
  }, 250);

  // ---------------------------------------------------------------- início

  (async () => {
    try {
      uid = await entrarAnonimo();
    } catch (e) {
      $("conectando").textContent = "Não consegui conectar: " + e.message;
      return;
    }
    const c = location.hash.slice(1).toUpperCase();
    if (!/^[A-Z]{4}$/.test(c)) return mostrarEntrada();
    try {
      const erro = await conferir(c);
      if (erro) { mostrarEntrada(c); $("erro-entrada").innerHTML = erro; return; }
      // Quem já está na partida (recarregou a página) volta direto para ela.
      if ((await getDoc(doc(db, "partidas", c, "jogadores", uid))).exists()) return jogar(c);
      mostrarEntrada(c);
    } catch (e) {
      mostrarEntrada(c);
      $("erro-entrada").textContent = "Erro: " + e.message;
    }
  })();
</script>
</body>
</html>
